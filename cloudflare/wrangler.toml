# Währungen – ein Worker, statische PWA, gemeinsame Kurse, Abos je Gerät.
# GitHub Actions / GitHub Pages bleiben unverändert parallel dazu.
# Kein APP_PASSWORD und kein globales NTFY_TOPIC: jedes Gerät hat ein eigenes ntfy-Thema.
# database_id der bestehenden D1-Datenbank «waehrungen».
name = "waehrungen"
main = "src/index.js"
compatibility_date = "2026-10-09"
account_id = "7990e79f1ae37e88673013377e1e75f0"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# data/ und api/ immer aus dem Worker, nie aus einer statischen Kopie.
run_worker_first = ["/data/*", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "waehrungen"
database_id = "89ef4623-822f-425e-b016-fe0bb43b946f"
migrations_dir = "migrations"

# Cloudflare zählt 1 = Sonntag bis 7 = Samstag. MON-FRI und SAT, nicht 1-5 und 6.
[triggers]
crons = [
  "5 * * * MON-FRI",
  "5 6 * * SAT",
  "*/15 5-21 * * MON-FRI",
]

[vars]
# Klickziel der ntfy-Meldungen. Leer lassen, wenn die Meldungen ohne Link raus sollen.
APP_URL = "https://waehrungen.bigyok61.workers.dev/"
