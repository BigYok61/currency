# Währungen – ein Worker, statische PWA, D1, zwei Cron-Gruppen.
# GitHub Actions / GitHub Pages bleiben unverändert parallel dazu.
# database_id nach `npx wrangler d1 create waehrungen` einsetzen.
name = "waehrungen"
main = "src/index.js"
compatibility_date = "2026-10-09"
account_id = "7990e79f1ae37e88673013377e1e75f0"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# data/ und api/ immer aus dem Worker, nie aus einer statischen Kopie.
run_worker_first = ["/data/*", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "waehrungen"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = [
  "5 * * * 1-5",
  "5 6 * * 6",
  "*/15 5-21 * * 1-5",
]

[vars]
# Nach dem ersten Deploy auf die echte URL setzen (workers.dev oder eigene Domain).
# Leer = ntfy-Meldungen ohne Klick-Link. Beispiel:
# APP_URL = "https://waehrungen.<subdomain>.workers.dev/"
APP_URL = ""
