name: Kurse erfassen und Seite veroeffentlichen

on:
  schedule:
    # GitHub-Cron laeuft in UTC und kann sich verspaeten. Stuendlich um :05 (Mo–Fr) plus ein Nachlauf am Samstag.
    # Jede volle Stunde Europe/Zurich faellt in CET (UTC+1) und CEST (UTC+2) auf eine dieser Stunden,
    # also auch 06:00 und 20:00. data/capture-times.json nennt Von, Bis und Abstand (1, 2, 3, 4, 8, 12 oder 24 Stunden).
    # Das Raster wird angezeigt; 16:00 wird immer zusaetzlich erfasst (Tagesendkurs). Die Prognose nutzt die Startstunde.
    # Verpasste Punkte traegt das Skript aus dem ca. 7-taegigen Verlauf von biquote.io nach.
    - cron: "5 * * * 1-5"
    - cron: "5 6 * * 6"
  push:
    branches: [main]
    # capture-times.json und fx-alerts.json auf main loesen Erfassung (inkl. Nachtrag) und Pages aus.
    # rates.json (dieser Job) und fx-alert-state.json (fx-alerts.yml) bleiben aussen vor, damit die
    # eigenen Daten-Commits keine Schleife bilden. Pushes mit GITHUB_TOKEN starten Workflows ohnehin nicht.
    paths-ignore:
      - data/rates.json
      - data/fx-alert-state.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse erfassen
        run: python3 scripts/capture.py
      - name: Verlauf committen (nur bei Aenderungen)
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "Keine neuen Werte."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rates.json
            git commit -m "Kurse $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css sw.js manifest.webmanifest icons data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
