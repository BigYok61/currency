name: FX-Push-Alarme (ntfy)

on:
  schedule:
    # alle 15 Min. Mo–Fr 05–21 UTC (= 06/07 bis 22/23 Uhr Zuerich je nach Sommer-/Winterzeit);
    # das Skript prueft selbst auf werktags 07:00–22:00 Europe/Zurich (Wochenende wird uebersprungen).
    - cron: "*/15 5-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Test-Push senden (als TEST gekennzeichnet)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FX-Alarme pruefen und senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python3 scripts/fx_alerts.py --test; else python3 scripts/fx_alerts.py; fi
      - name: Alarmstatus committen (nur bei Aenderungen)
        run: |
          if git diff --quiet -- data/fx-alert-state.json && [ -z "$(git ls-files --others --exclude-standard data/fx-alert-state.json)" ]; then
            echo "Kein neuer Status."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fx-alert-state.json
            git commit -m "FX-Alarmstatus"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
